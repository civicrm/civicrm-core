<div id="bootstrap-theme" crm-dialog="expandedEditDlg" ng-controller="MsgtpluiGenericCtrl">

  <form name="expandedEditForm" crm-ui-id-scope>

    <nav class="navbar navbar-default">
      <div class="container-fluid">
        <div class="navbar-header">
          <div class="navbar-brand">
            {{::model.title}}
          </div>
        </div>
        <div class="navbar-form navbar-right">
          <div class="form-group">
            <button type="button" class="btn btn-default" ng-if="model.canToggleRichText" title="{{ model.isRichText() ? ts('Switch to raw HTML') : ts('Switch to rich text') }}" ng-click="model.toggleRichText()">
              <i class="crm-i {{ model.isRichText() ? 'fa-code' : 'fa-font' }}" role="img" aria-hidden="true"></i>
              {{ model.isRichText() ? ts('Raw HTML') : ts('Rich Text') }}
            </button>

            <button type="button" class="btn btn-default" ng-click="model.openPreview({formatName: model.field})">
              <i class="crm-i fa-eye" role="img" aria-hidden="true"></i>
              {{ ::ts('Preview') }}
            </button>

            <input class="form-control crm-action-menu fa-code"
                   ng-show="!model.isDiff"
                   tabindex="-1"
                   style="z-index:1"
                   crm-ui-select="{placeholder: ts('Token'), data: model.tokenList, width: '12em', dropdownAutoWidth: true}"
                   on-crm-ui-select="$broadcast('insert:expanded', selection)"
            />

            <button type="button" class="btn btn-default" ng-click="expandedEditDlg.close()">
              <i class="crm-i fa-times" role="img" aria-hidden="true"></i>
              {{ ::ts('Close') }}
            </button>

          </div>
        </div>
      </div>
    </nav>

    <div ng-if="model.isRichText()">
      <textarea crm-ui-id="expandedEditForm.richtext"
           class="crm-msgadm-richtext"
           crm-ui-richtext
           crm-ui-insert-rx="insert:expanded"
           ng-model="model.record[model.field]"
           data-preset="civimail"
      ></textarea>
    </div>
    <div ng-if="!model.isRichText()"
         ng-model="model.record[model.field]"
         crm-monaco="model.monacoOptions"
         crm-monaco-insert-rx="insert:expanded"
         crm-monaco-original="model.original"
    ></div>
  </form>

</div>
