<div class="crm-search-display crm-search-display-table">
  <div class="alert alert-info crm-search-display-description" ng-if="$ctrl.settings.description">{{:: $ctrl.settings.description }}</div>
  <div class="form-inline">
    <div class="btn-group" ng-include="'~/crmSearchDisplay/SearchButton.html'" ng-if="$ctrl.settings.button"></div>
    <crm-search-tasks-menu ng-if="$ctrl.settings.actions && $ctrl.taskManager" ids="$ctrl.selectedRows" task-manager="$ctrl.taskManager" display-mode="$ctrl.settings.actions_display_mode || 'menu'"></crm-search-tasks-menu>
    <span ng-if="$ctrl.settings.headerCount" ng-include="'~/crmSearchDisplay/ResultCount.html'"></span>
    <div class="form-group pull-right" ng-include="'~/crmSearchDisplay/toolbar.html'" ng-if="$ctrl.toolbar"></div>
    <details ng-if="$ctrl.settings.toggleColumns">
      <summary>{{:: ts('Pick Columns') }}</summary>
      <div class="crm-accordion-body">
        <!-- TODO: select2 might be nicer here? -->
        <label ng-repeat="(index, col) in $ctrl.columns">
          <input type="checkbox"
            ng-model="$ctrl.columns[index].enabled"
            ng-change="$ctrl.toggleColumns()"
            >
            {{:: $ctrl.getColumnToggleLabel(col) }}
        </label>
        <button type="button" title="{{:: ts('Select All') }}" class="btn btn-secondary" ng-click="$ctrl.resetColumnToggles()">
          {{:: ts('All') }}
        </button>
        <button type="button" title="{{:: ts('Select None') }}" class="btn btn-secondary" ng-click="$ctrl.clearColumnToggles()">
          {{:: ts('None') }}
        </button>
      </div>
    </details>
  </div>
  <table class="{{:: $ctrl.settings.classes.join(' ') }}" ng-if="$ctrl.loading">
    <thead ng-if="$ctrl.settings.hideThead !== true">
      <tr>
        <th ng-class="{'crm-search-result-select': $ctrl.settings.actions}" ng-include="'~/crmSearchDisplayTable/crmSearchDisplayTaskHeader.html'" ng-if=":: $ctrl.hasExtraFirstColumn()">
          <span class="sr-only">{{:: ts('Bulk row actions')}}</span>
        </th>
        <th ng-repeat="col in $ctrl.columns" ng-if="col.enabled" class="{{:: $ctrl.getHeaderClass(col) }}">
          <span class="crm-search-display-table-column-label">{{:: col.label }}</span>
        </th>
      </tr>
    </thead>
    <tbody ng-include="'~/crmSearchDisplayTable/crmSearchDisplayTableLoading.html'"></tbody>
  </table>
  <div ng-if="!$ctrl.loading && !$ctrl.settings.group_by" ng-init="rows = $ctrl.results" ng-include="'~/crmSearchDisplayTable/crmSearchDisplayTableInner.html'"></div>
  <div ng-if="!$ctrl.loading && $ctrl.settings.group_by" ng-repeat="group in $ctrl.groups" class="crm-search-display-table-group">
    <div ng-include="'~/crmSearchDisplayTable/crmSearchDisplayTableGroupHeader.html'"></div>
    <div ng-init="rows = group.rows" ng-include="'~/crmSearchDisplayTable/crmSearchDisplayTableInner.html'"></div>
  </div>
  <div ng-if="$ctrl.rowCount === 0 && $ctrl.settings.noResultsText !== false" class="crm-search-display-list-no-results">
    <p class="alert alert-info text-center">
      {{ $ctrl.settings.noResultsText || ts('None found.') }}
    </p>
  </div>
  <div ng-include="'~/crmSearchDisplay/Pager.html'"></div>
</div>
