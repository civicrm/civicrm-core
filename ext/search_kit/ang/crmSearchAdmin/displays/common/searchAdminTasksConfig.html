<div class="checkbox-inline form-control">
  <label>
    <input type="checkbox" ng-checked="$ctrl.display.settings.actions" ng-click="$ctrl.toggleActions()">
    <span>{{:: ts('Actions Menu') }}</span>
  </label>
</div>
<div class="input-group" ng-if="$ctrl.display.settings.actions && $ctrl.actionableEntities.length > 1">
  <div class="input-group-btn">
    <button type="button" ng-click="$ctrl.entitiesMenuOpen = true" class="btn btn-sm btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
      <span>{{ $ctrl.getEnabledEntitiesLabel() }}</span>
      <span class="caret"></span>
    </button>
    <ul class="dropdown-menu" ng-if="$ctrl.entitiesMenuOpen">
      <li ng-repeat="entity in $ctrl.actionableEntities">
        <a href ng-click="$ctrl.toggleEntity(entity.join); $event.stopPropagation()">
          <input type="checkbox" ng-checked="$ctrl.isEntityEnabled(entity.join)">
          {{:: entity.label }}
        </a>
      </li>
    </ul>
  </div>
</div>
<div class="input-group" ng-if="$ctrl.display.settings.actions">
  <div class="input-group-btn">
    <button type="button" ng-click="$ctrl.menuOpen = true" class="btn btn-sm btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
      <span ng-if="$ctrl.display.settings.actions === true">{{:: ts('All Enabled') }}</span>
      <span ng-if="$ctrl.display.settings.actions !== true">{{ ts('%1 Enabled', {1: $ctrl.display.settings.actions.length}) }}</span>
      <span class="caret"></span>
    </button>
    <ul class="dropdown-menu" ng-if="$ctrl.menuOpen">
      <li ng-if="!$ctrl.allTasks" class="disabled">
        <a href><i class="crm-i fa-spinner fa-spin" role="img" aria-hidden="true"></i></a>
      </li>
      <li ng-repeat-start="group in $ctrl.taskGroups" ng-if="$ctrl.taskGroups.length > 1 && group.label" class="dropdown-header">{{:: group.label }}</li>
      <li ng-repeat="task in group.tasks">
        <a href ng-click="$ctrl.toggleTask(task.name); $event.stopPropagation()">
          <input type="checkbox" ng-checked="$ctrl.isEnabled(task)">
          {{:: task.title }}
        </a>
      </li>
      <li ng-repeat-end ng-if="$ctrl.taskGroups.length > 1 && !$last" role="separator" class="divider"></li>
    </ul>
  </div>
</div>
<select ng-if="$ctrl.display.settings.actions" class="form-control" ng-model="$ctrl.display.settings.actions_display_mode">
  <option value="menu">{{:: ts('Dropdown') }}</option>
  <option value="buttons">{{:: ts('Buttons') }}</option>
</select>
