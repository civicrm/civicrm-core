<h1 crm-page-title crm-document-title="ts('CiviCRM System Status') + ' (' + countVisible(true) + ')'">
  {{:: ts('CiviCRM System Status') }}
</h1>

<div id="crm-status-list" crm-ui-tab-set>
  <div crm-ui-tab
    ng-repeat="tab in [{is_visible: true, icon: 'fa-bell'}, {is_visible: false, icon: 'fa-bell-slash-o'}]"
    id="tab-status-visible-{{tab.is_visible ? 1 : 0}}"
    count="{{countVisible(tab.is_visible)}}"
    crm-title="tab.is_visible ? ts('Active') : ts('Hidden')"
    crm-icon="{{tab.icon}}"
    >
    <div ng-if="!$ctrl.statuses">
      <div class="crm-loading-spinner">
        <div class="sr-only">{{:: ts('Loading') }}</div>
      </div>
    </div>
    <div class="crm-status-item" ng-repeat="status in $ctrl.statuses | filter:{is_visible: tab.is_visible}" >
      <h3 class="crm-severity-{{status['severity_id:name']}}">
        <i ng-if="status.icon" class="crm-i {{status.icon}}" role="img" aria-hidden="true"></i>
        {{status.title}}
        <div statuspage-popup-menu class="hush-menu css_right"></div>
        <div ng-if="!status.is_visible" class="hidden-until css_right">
          ({{status.hidden_until ? ts('Hidden until %1', {1: formatDate(status.hidden_until)}) : ts('Hidden permanently')}})
        </div>
      </h3>
      <div class="crm-block crm-status-message-body">
        <span ng-bind-html="status.message | trusted"></span>
        <a
          ng-if="status.help"
          class="helpicon"
          ng-click="help(status.title, status.help);"
          href="javascript:void(0)"
          >
        </a>
        <div ng-if="status.actions" class="crm-buttons crm-status-item-actions">
          <button type="button" ng-repeat="action in status.actions" ng-click="$ctrl.doAction(action)">
            <i class="crm-i {{:: action.icon }}" ng-if="action.icon" role="img" aria-hidden="true"></i>
            {{:: action.title }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
