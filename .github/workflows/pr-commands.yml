name: PR Commands

on:
  issue_comment:
    types: [created]

jobs:
  pr_commands:
    name: Execute PR Command
    if: |
      github.event.issue.pull_request != null &&
      (startsWith(github.event.comment.body, '/squash') || startsWith(github.event.comment.body, '/rebase') || startsWith(github.event.comment.body, '/lintroll') || startsWith(github.event.comment.body, '/lint') || startsWith(github.event.comment.body, '/port') || startsWith(github.event.comment.body, '/backport') || startsWith(github.event.comment.body, '/SQUASH') || startsWith(github.event.comment.body, '/REBASE') || startsWith(github.event.comment.body, '/LINTROLL') || startsWith(github.event.comment.body, '/LINT') || startsWith(github.event.comment.body, '/PORT') || startsWith(github.event.comment.body, '/BACKPORT'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      - name: Check Authorization
        id: auth
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          IS_AUTHORIZED=false
          if [ "$COMMENT_AUTHOR" = "$PR_AUTHOR" ]; then
            IS_AUTHORIZED=true
          elif [[ "$AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            IS_AUTHORIZED=true
          fi

          if [ "$IS_AUTHORIZED" = "false" ]; then
            echo "Error: User $COMMENT_AUTHOR is not authorized to run commands on this PR."
            exit 1
          fi

      - name: Add Eyes Reaction
        env:
          GH_TOKEN: ${{ secrets.PR_COMMANDS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='eyes'

      - name: Fetch PR Details
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.PR_COMMANDS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,headRepository,headRepositoryOwner,baseRefName,state,mergeCommit)

          STATE=$(echo "$PR_JSON" | jq -r '.state')
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.mergeCommit.oid // empty')
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          HEAD_OWNER=$(echo "$PR_JSON" | jq -r '.headRepositoryOwner.login // empty')
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.headRepository.name // empty')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')

          echo "state=$STATE" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "head_owner=$HEAD_OWNER" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT

      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_COMMANDS_PAT || secrets.GITHUB_TOKEN }}

      - name: Parse and Execute Command
        id: exec
        env:
          GH_TOKEN: ${{ secrets.PR_COMMANDS_PAT || secrets.GITHUB_TOKEN }}
          PR_COMMANDS_PAT: ${{ secrets.PR_COMMANDS_PAT }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          STATE: ${{ steps.pr_info.outputs.state }}
          MERGE_COMMIT: ${{ steps.pr_info.outputs.merge_commit }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          HEAD_OWNER: ${{ steps.pr_info.outputs.head_owner }}
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          BASE_REF: ${{ steps.pr_info.outputs.base_ref }}
        run: bash .github/scripts/pr-commands.sh

      - name: Add Success Reaction
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PR_COMMANDS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='+1'

      - name: Add Failure Reaction and Comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PR_COMMANDS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Add reaction
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='confused'

          # 2. Use the script's failure message, if it set one
          DEFAULT_MSG="### ❌ Command Execution Failed"$'\n\n'"The workflow failed to execute the command. Please check the action run logs for details."
          MSG="${FAILURE_MSG:-$DEFAULT_MSG}"

          # 3. Post comment
          gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
